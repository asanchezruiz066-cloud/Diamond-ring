
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Diamond Ring - JIN2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
"use strict";

const TAU=Math.PI*2;
const LOOP=20,BUILD=3.2,TURN=12,FLOOR=-.78;
const DRAW=[.3,5.6];
const R=.55,TUBE=.065;
const CHARS=" .,:~+*^01|/\\-_#()x"+"1il!;:"+"rtfjcvxz=+"+"aeoun0{}[]<>"+"08B$#&%Q";
const POOLS=["1il!:;","rtfjcvxz=+","aeoun0{}[]<>","08B$#&%Q"];
const AT={};
[...CHARS].forEach((c,i)=>AT[c]=i);

const COLORS=[
[214,220,232],[232,236,244],[226,238,255],
[255,255,255],[255,170,200],[160,210,255],
[255,230,160],[255,214,140],[150,150,165],[120,120,140]
];

const BAND=0,PRONG=1,GEM=2,GLINT=3,FIRE_R=4,FIRE_B=5,FIRE_G=6,DUST=7,REFL=8,STAR=9;

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const norm=v=>{let l=Math.hypot(...v)||1;return v.map(x=>x/l)};
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[
 a[1]*b[2]-a[2]*b[1],
 a[2]*b[0]-a[0]*b[2],
 a[0]*b[1]-a[1]*b[0]
];
const add=(a,b)=>a.map((v,i)=>v+b[i]);
const mul=(a,s)=>a.map(v=>v*s);
const sub=(a,b)=>a.map((v,i)=>v-b[i]);

let seed=13;
function random(){
 seed=(seed*1664525+1013904223)>>>0;
 return seed/4294967296;
}
function rng(s){seed=s;return random;}

const points=[],normals=[],kinds=[],parts=[],orders=[];

function addPoint(p,n,kind,part,order){
 points.push(p);normals.push(norm(n));
 kinds.push(kind);parts.push(part);orders.push(order);
}

// ARO
function buildBand(){
 for(let i=0;i<520;i++){
  const a=TAU*i/520;
  const rr=TUBE*(1-.35*Math.pow(Math.max(0,Math.sin(a)),6));
  const c=[Math.cos(a),Math.sin(a),0];

  for(let j=0;j<44;j++){
   const b=TAU*j/44;
   const n=add(mul(c,Math.cos(b)),[0,0,Math.sin(b)]);
   const p=add(mul(c,R),mul(n,rr));
   p[2]*=1.5;
   const up=Math.abs(Math.atan2(Math.sin(a+Math.PI/2),Math.cos(a+Math.PI/2)))/Math.PI;
   addPoint(p,n,BAND,0,up);
  }
 }
}

// DIAMANTE
function buildDiamond(){
 const m=16;
 let facetId=0;
 for(let i=0;i<m;i++){
  const a=TAU*i/m,b=TAU*(i+1)/m;
  const g0=[.25*Math.cos(a),.88,.25*Math.sin(a)];
  const g1=[.25*Math.cos(b),.88,.25*Math.sin(b)];
  const t0=[.135*Math.cos(a),1,.135*Math.sin(a)];
  const t1=[.135*Math.cos(b),1,.135*Math.sin(b)];
  const culet=[0,.66,0],table=[0,1,0];

  const facets=[
   [g0,g1,t0,norm(cross(sub(g1,g0),sub(t0,g0)))],
   [g1,t1,t0,norm(cross(sub(t1,g1),sub(t0,g1)))],
   [g0,g1,culet,norm(cross(sub(culet,g0),sub(g1,g0)))],
   [table,t0,t1,[0,1,0]]
  ];

  for(const [a0,b0,c0,n] of facets){
   for(let u0=0;u0<16;u0++){
    for(let v0=0;v0<16;v0++){
     const u=u0/15,v=v0/15;
     if(u+v>1)continue;
     const p=add(a0,add(mul(sub(b0,a0),u),mul(sub(c0,a0),v)));
     const order=1.25+(p[1]-.66)/(.34)*.45;
     addPoint(p,n,GEM,10+facetId,order);
    }
   }
   facetId++;
  }
 }
}

// GARRAS
function buildProngs(){
 for(let i=0;i<4;i++){
  const a=TAU*(i+.5)/4;
  const base=[.08*Math.cos(a),R+.02,.08*Math.sin(a)];
  const tip=[.265*Math.cos(a),.97,.265*Math.sin(a)];
  const d=norm(sub(tip,base));
  const s=norm(cross(d,[0,0,1]));
  const w=cross(s,d);

  for(let j=0;j<40;j++){
   const u=j/39;
   for(let k=0;k<12;k++){
    const phi=TAU*k/12;
    const n=add(mul(s,Math.cos(phi)),mul(w,Math.sin(phi)));
    const p=add(add(base,mul(sub(tip,base),u)),mul(n,.022));
    const order=1+(p[1]-R)/(1-R)*.25;
    addPoint(p,n,PRONG,1,order);
   }
  }
 }
}
buildBand();buildDiamond();buildProngs();

function rotation(p,a){
 const c=Math.cos(a),s=Math.sin(a);
 return [c*p[0]+s*p[2],p[1],-s*p[0]+c*p[2]];
}

function camera(P){
 const eye=[0,.85,4.7],target=[0,.22,0];
 const fwd=norm(sub(target,eye));
 const right=norm(cross(fwd,[0,1,0]));
 const up=cross(right,fwd);
 const rel=sub(P,eye);
 return [dot(rel,right),dot(rel,up),dot(rel,fwd)];
}

const stars=Array.from({length:90},()=>[
 random()*10-5,random()*6-1.5,-6
]);

const dusts=Array.from({length:520},()=>[
 random(),random(),random(),random()
]);

const sparksData=Array.from({length:2600},()=>[
 random(),random(),random(),random(),random()
]);

const burstData=Array.from({length:700},()=>[
 random(),random(),random()
]);

const haloData=Array.from({length:900},()=>[
 random(),random()
]);

const sparkBorn=sparksData.map(s=>{
 const idx=Math.floor(s[0]*points.length);
 return DRAW[0]+orders[idx]/1.7*(DRAW[1]-DRAW[0]);
});

const canvas=document.querySelector("#screen");
const ctx=canvas.getContext("2d");
let cols,rows,aspect;
let paused=false,time=0,last=performance.now();

function resize(){
 const w=innerWidth,h=innerHeight;
 const ratio=Math.min(devicePixelRatio||1,1.5);
 canvas.width=Math.floor(w*ratio);
 canvas.height=Math.floor(h*ratio);
 canvas.style.width=w+"px";
 canvas.style.height=h+"px";
 ctx.setTransform(ratio,0,0,ratio,0,0);
 cols=Math.max(60,Math.floor(w/6));
 rows=Math.max(40,Math.floor(h/9));
 aspect=cols*6/(rows*9);
}
addEventListener("resize",resize);
resize();

function reveal(t){
 const head=(t-.3)/(5.6-.3)*1.7;
 return orders.map(o=>smooth((head-o)/.06));
}

function lights(t){
 return [
  norm([0,.8,.6]),
  norm([Math.cos(t*.9),.5,Math.sin(t*.9)])
 ];
}

function makeScene(t){
 const yaw=TAU*Math.max(t-DRAW[1]-.6,0)/TURN;
 const [key,rim]=lights(t);
 const view=camera([0,0,0]);
 const halfK=norm(add(key,view));
 const halfR=norm(add(rim,view));
 const visible=reveal(t);

 const P=[],S=[],T=[],K=[];
 let glints=0;

 for(let i=0;i<points.length;i++){
  const p=rotation(points[i],yaw);
  const n=rotation(normals[i],yaw);
  const diff=Math.max(0,dot(n,key));
  const spec=Math.pow(Math.max(0,dot(n,halfK)),30)+
   .9*Math.pow(Math.max(0,dot(n,halfR)),24);
  const metal=kinds[i]!==GEM;
  let shade=metal?.5+.35*diff+.9*spec:.8+.2*diff+1.4*spec;
  let kind=kinds[i];
  const fire=(i+Math.floor(t*7))%4;
  const glint=!metal&&spec>.18;
  if(glint){
   kind=[GLINT,FIRE_R,FIRE_B,FIRE_G][fire];
   glints++;
  }
  if(metal&&spec>.5)kind=GLINT;

  const tip=Math.abs((t-DRAW[0])/(DRAW[1]-DRAW[0])*1.7-orders[i])<.035;
  if(visible[i]<.96){
   shade=tip?1.2:0;
   kind=tip?GLINT:DUST;
  }

  P.push(p);
  S.push(shade*(1+.8*Math.exp(-Math.pow((t-DRAW[1]-.15)/.18,2))));
  T.push(kind);
  K.push(visible[i]<.96?-2:parts[i]);

  const refl=p.slice();
  refl[1]=2*FLOOR-p[1]-.06;
  P.push(refl);
  S.push(visible[i]>=.96?.22*clamp(shade,0,1.2):0);
  T.push(REFL);K.push(-1);
 }

 // Polvo flotante
 for(const d of dusts){
  const a=d[0]*TAU+t*(.3+.5*d[1]);
  const r=.9+.8*d[2];
  const y=((d[3]*2.4+t*.08)%2.4)-.8;
  P.push([Math.cos(a)*r,y,Math.sin(a)*r*.7]);
  S.push((.25+.75*Math.pow(Math.max(0,Math.sin(t*(2+3*d[1])+d[0]*40)),4))*smooth((t-BUILD+.5)/1.5));
  T.push(DUST);K.push(-1);
 }

 // Estrellas
 for(const p of stars){
  P.push(p);
  S.push(.1+.1*Math.sin(t*2+p[2]));
  T.push(STAR);K.push(-1);
 }

 // Chispas
 for(let i=0;i<sparksData.length;i++){
  const d=sparksData[i],age=t-sparkBorn[i];
  const life=.9+.9*d[1];
  if(age<=0||age>=life)continue;
  const idx=Math.floor(d[0]*points.length);
  const a=d[2]*TAU;
  const v=[
   Math.cos(a)*(.4+.6*d[3]),
   .5+.9*d[4],
   Math.sin(a)*(.4+.6*d[3])
  ];
  const p=add(points[idx],mul(v,age));
  p[1]-=1.1*age*age;
  P.push(p);
  S.push(Math.pow(clamp(1-age/life),1.3)*(.6+.4*Math.sin(age*30+a)));
  T.push(d[3]>.7?GLINT:DUST);K.push(-1);
 }

 // Explosión de luz
 const bk=t-DRAW[1]-.1;
 if(bk>=0&&bk<=2.2){
  for(const d of burstData){
   const a=d[0]*TAU;
   const r=.85+2.4*(1-Math.exp(-bk*2))*(.97+.06*d[1]);
   P.push([Math.cos(a)*r,.42+Math.sin(a)*r,(d[2]-.5)*.05-.4]);
   S.push(Math.pow(clamp(1-bk/2.2),1.5));
   T.push(d[1]<.25?FIRE_R:d[1]<.45?FIRE_B:d[1]<.6?FIRE_G:GLINT);
   K.push(-1);
  }
 }

 // Órbitas
 const on=smooth((t-DRAW[1]-.3)/1.5);
 if(on>0){
  for(let i=0;i<900;i++){
   const d=haloData[i],half=i<450?0:1;
   const a=d[0]*TAU+t*(half===0?.9:-.7);
   const tilt=half===0?.55:-.55;
   const x=Math.cos(a)*1.05,y=Math.sin(a)*.32,z=Math.sin(a)*.95;
   P.push([
    x*Math.cos(tilt)-y*Math.sin(tilt),
    x*Math.sin(tilt)+y*Math.cos(tilt)+.42,z
   ]);
   const head=(d[0]*37+t*1.3)%1;
   S.push(on*(.15+.85*clamp(1-head*3))*(.6+.4*Math.sin(t*6+d[1]*TAU)));
   T.push(d[1]>.5?DUST:GLINT);K.push(-1);
  }
 }

 return {P,S,T,K,yaw,glints};
}

function render(t){
 const data=makeScene(t);
 const {P,S,T,K,yaw,glints}=data;
 const count=cols*rows;
 const depth=new Float32Array(count).fill(99);
 const part=new Int32Array(count).fill(-1);
 const lum=new Float32Array(count);
 const tag=new Int32Array(count);
 const body=new Uint8Array(count);
 const screen=[];

 for(let i=0;i<P.length;i++){
  const [x,y,z]=camera(P[i]);
  if(z<=.2)continue;
  const sx=(.5+x/z*1.45)*cols;
  const sy=(.5-y/z*1.45*aspect)*rows;
  const ix=Math.floor(sx),iy=Math.floor(sy);
  if(ix<0||ix>=cols||iy<0||iy>=rows)continue;
  const idx=iy*cols+ix;
  if(z<depth[idx]){
   depth[idx]=z;
   part[idx]=K[i];
   lum[idx]=S[i];
   tag[idx]=T[i];
  }
 }
 for(let i=0;i<count;i++)body[i]=part[i]>=0?1:0;

 const chars=new Uint16Array(count);
 const level=new Uint8Array(count);
 const gx=new Int16Array(count),gy=new Int16Array(count);

 for(let y=0;y<rows;y++){
  for(let x=0;x<cols;x++){
   const i=y*cols+x;
   if(!body[i])continue;
   let edge=false;
   for(let dy=-1;dy<=1;dy++){
    for(let dx=-1;dx<=1;dx++){
     if(!dx&&!dy)continue;
     const xx=x+dx,yy=y+dy;
     if(xx<0||xx>=cols||yy<0||yy>=rows){
      edge=true;gx[i]+=dx;gy[i]+=dy;continue;
     }
     const j=yy*cols+xx;
     if(!body[j]||(part[j]!==part[i]&&depth[j]>depth[i]+.02)){
      edge=true;gx[i]+=dx;gy[i]+=dy;
     }
    }
   }

   const h=(y*7919+x*104729)%9973;
   const l=clamp(Math.floor(lum[i]*3.2),0,3);
   level[i]=l;
   const pool=POOLS[l];
   chars[i]=AT[pool[(h+Math.floor(t*4+h%11))%pool.length]];
   if(edge){
    const ax=Math.abs(gx[i]),ay=Math.abs(gy[i]);
    let c;
    if(ax>2*ay)c="|";
    else if(ay>2*ax)c=gy[i]>0?"_":"-";
    else c=gx[i]*gy[i]>0?"/":"\\";
    chars[i]=AT[c];
   }
   if([GLINT,FIRE_R,FIRE_B,FIRE_G].includes(tag[i]))chars[i]=AT["*"];
  }
 }

 // Polvo y reflejos
 for(let i=0;i<P.length;i++){
  if(K[i]>=0)continue;
  const [x,y,z]=camera(P[i]);
  if(z<=.2)continue;
  const ix=Math.floor((.5+x/z*1.45)*cols);
  const iy=Math.floor((.5-y/z*1.45*aspect)*rows);
  if(ix<0||ix>=cols||iy<0||iy>=rows)continue;
  const idx=iy*cols+ix;
  if(body[idx]&&depth[idx]<z)continue;
  if(body[idx])continue;
  if(S[i]<.02)continue;
  let c;
  if(T[i]===REFL){
   const pool=POOLS[clamp(Math.floor(S[i]*6),0,3)];
   c=pool[(iy*31+ix)%pool.length];
  }else if(T[i]===STAR)c=".";
  else if(T[i]===DUST)c=S[i]>.7?"*":S[i]>.35?"+":".";
  else c=["&","8","%"][(ix+iy)%3];
  chars[idx]=AT[c];
  lum[idx]=S[i];
  tag[idx]=T[i];
 }

 // Dibujar ASCII y destellos
 ctx.fillStyle="#000";
 ctx.fillRect(0,0,innerWidth,innerHeight);
 const cw=innerWidth/cols,ch=innerHeight/rows;
 ctx.font=`${Math.max(6,ch*.94)}px monospace`;
 ctx.textAlign="center";ctx.textBaseline="middle";

 for(let y=0;y<rows;y++){
  for(let x=0;x<cols;x++){
   const i=y*cols+x,c=chars[i];
   if(!c)continue;
   const l=body[i]?clamp(lum[i],.3,1):clamp(lum[i],0,1);
   let color=COLORS[clamp(tag[i],0,9)];
   const a=Math.min(1,l*(body[i]?1.1:1));
   ctx.fillStyle=`rgba(${color[0]},${color[1]},${color[2]},${a})`;
   ctx.fillText(CHARS[c],(x+.5)*cw,(y+.5)*ch);
  }
 }

 // Rayos de los seis destellos principales
 const scores=[];
 for(let i=0;i<count;i++){
  if(body[i]&&[GLINT,FIRE_R,FIRE_B,FIRE_G].includes(tag[i]))
   scores.push([lum[i]+((i*7919)%7)*.01,i]);
 }
 scores.sort((a,b)=>b[0]-a[0]);
 for(let n=0;n<Math.min(6,scores.length);n++){
  const i=scores[n][1],x=i%cols,y=Math.floor(i/cols);
  const pulse=.5+.5*Math.sin(t*7+n*1.7);
  const reach=Math.floor(5+9*pulse);
  ctx.fillStyle="rgba(255,255,255,.75)";
  for(let d=1;d<=reach;d++){
   const fade=1-d/(reach+1);
   for(const [dy,dx,c] of [[0,1,"-"],[0,-1,"-"],[1,0,"|"],[-1,0,"|"]]){
    const xx=x+dx*d*2,yy=y+dy*d;
    if(xx>=0&&xx<cols&&yy>=0&&yy<rows){
     ctx.fillStyle=`rgba(220,235,255,${fade})`;
     ctx.fillText(c,(xx+.5)*cw,(yy+.5)*ch);
    }
   }
  }
  ctx.fillStyle="#fff";
  ctx.fillText("*",(x+.5)*cw,(y+.5)*ch);
 }

 // HUD original
 ctx.textAlign="left";
 ctx.font="14px monospace";
 ctx.fillStyle="rgba(120,112,128,.8)";
 ctx.fillText("@jin_22ee · 2026",64,innerHeight-70);
 ctx.fillStyle="rgba(160,155,175,.8)";
 ctx.fillText(`rotation ${(yaw*180/Math.PI%360).toFixed(2)}°   glints ${glints}`,64,innerHeight-44);
 ctx.fillText(`letters ${String(count).padStart(5,"0")}`,64,innerHeight-18);
 ctx.textAlign="right";
 ctx.fillStyle="#ff7ab6";
 ctx.fillText(`● t ${t.toFixed(2)}s`,innerWidth-35,35);
}

function animate(now){
 const dt=Math.min((now-last)/1000,.066);
 last=now;
 if(!paused)time+=dt;
 if(time>=LOOP)time=0;
 render(time);
 requestAnimationFrame(animate);
}

addEventListener("keydown",e=>{
 if(e.code==="Space"){paused=!paused;e.preventDefault();}
 if(e.key.toLowerCase()==="r")time=0;
 if(e.key.toLowerCase()==="s"){
  const a=document.createElement("a");
  a.download="diamond_ring.png";
  a.href=canvas.toDataURL("image/png");
  a.click();
 }
 if(e.key==="Escape")paused=true;
});

requestAnimationFrame(animate);
</script>
</body>
</html>
