
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diamond Ring 💎</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #030309;
  overflow: hidden;
  height: 100vh;
  display: grid;
  place-items: center;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}
</style>
</head>

<body>
<canvas id="scene"></canvas>

<script>
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");

let W, H, t = 0;

function resize() {
  W = canvas.width = innerWidth * devicePixelRatio;
  H = canvas.height = innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  W = innerWidth;
  H = innerHeight;
}
addEventListener("resize", resize);
resize();

const stars = Array.from({length:130},()=>({
  x:Math.random(), y:Math.random(),
  s:Math.random()*1.8,
  p:Math.random()*6
}));

const chars = " .,:;irsXA253hMHGS#9B&@";

function project(x,y,z,scale) {
  const perspective = 4/(4+z);
  return [
    W/2 + x*scale*perspective,
    H/2 + y*scale*perspective
  ];
}

function draw() {
  ctx.fillStyle="#030309";
  ctx.fillRect(0,0,W,H);

  stars.forEach(s=>{
    let a=.25+.65*(.5+.5*Math.sin(t*2+s.p));
    ctx.fillStyle=`rgba(170,195,255,${a})`;
    ctx.fillRect(s.x*W,s.y*H,s.s,s.s);
  });

  const scale=Math.min(W*.30,H*.34);
  let points=[];

  // ARO VERTICAL
  for(let i=0;i<500;i++){
    let u=i/500*Math.PI*2;
    for(let j=0;j<16;j++){
      let v=j/16*Math.PI*2;

      let x=(.70+.095*Math.cos(v))*Math.cos(u);
      let y=(1.05+.095*Math.cos(v))*Math.sin(u);
      let z=.095*Math.sin(v);

      let a=t*.55;
      let xx=x*Math.cos(a)-z*Math.sin(a);
      let zz=x*Math.sin(a)+z*Math.cos(a);

      let b=.20;
      let yy=y*Math.cos(b)-zz*Math.sin(b);
      let z2=y*Math.sin(b)+zz*Math.cos(b);

      let [px,py]=project(xx,yy,z2,scale);

      let light=Math.max(0,Math.cos(v+u*2+t));
      points.push({
        x:px,y:py,z:z2,
        c:chars[Math.floor(light*(chars.length-1))]
      });
    }
  }

  // DIAMANTE SUPERIOR
  const gem=[
    [0,-1.48,0],
    [-.43,-1.78,0],
    [.43,-1.78,0],
    [-.35,-2.08,0],
    [.35,-2.08,0],
    [0,-2.30,0],
    [-.22,-1.88,.24],
    [.22,-1.88,.24],
    [0,-2.30,.24]
  ];

  const edges=[
    [0,1],[0,2],[1,2],[1,3],[2,4],
    [3,4],[3,5],[4,5],[0,6],[0,7],
    [6,7],[6,3],[7,4],[6,8],[7,8],
    [5,8]
  ];

  const a=t*.55;
  function rotate(p) {
    let x=p[0],y=p[1],z=p[2];
    return [
      x*Math.cos(a)-z*Math.sin(a),
      y,
      x*Math.sin(a)+z*Math.cos(a)
    ];
  }

  edges.forEach(([i,j])=>{
    let p=rotate(gem[i]);
    let q=rotate(gem[j]);
    let P=project(...p,scale);
    let Q=project(...q,scale);

    for(let k=0;k<=35;k++){
      let f=k/35;
      points.push({
        x:P[0]+(Q[0]-P[0])*f,
        y:P[1]+(Q[1]-P[1])*f,
        z:0,
        c:chars[Math.floor((k/35)*18)+3]
      });
    }
  });

  points.sort((a,b)=>a.z-b.z);

  ctx.font=`${Math.max(7,Math.min(11,W/65))}px monospace`;
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  points.forEach(p=>{
    ctx.fillStyle="rgba(205,225,255,.88)";
    ctx.shadowColor="#77aaff";
    ctx.shadowBlur=7;
    ctx.fillText(p.c,p.x,p.y);
  });

  ctx.shadowBlur=0;

  // DESTELLOS
  for(let i=0;i<4;i++){
    let x=W/2+Math.sin(t+i*2)*scale*.95;
    let y=H/2+Math.cos(t*.7+i)*scale*.9;
    ctx.fillStyle="#dceaff";
    ctx.font="18px monospace";
    ctx.fillText("+",x,y);
  }

  t+=.012;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
